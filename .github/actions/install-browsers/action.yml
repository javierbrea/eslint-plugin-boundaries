name: Install Playwright browsers
description: Install Chromium, Firefox and WebKit of the Playwright version in the root package.json, with their system dependencies, restoring the browsers from the cache

runs:
  using: composite
  steps:
    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    # NOTE: When the browsers come from the cache, it only installs their system dependencies
    - name: Install Playwright browsers
      shell: bash
      run: pnpm exec playwright install --with-deps chromium firefox webkit
