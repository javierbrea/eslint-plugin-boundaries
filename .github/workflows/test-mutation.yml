name: Test Mutation
on:
  # NOTE: Runs on every push to master, which only receives the promotion of release and gives the score that the README badges read, and by hand on release from the Actions tab
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - elements
          - config
          - policies
          - analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install
      - name: Test Mutation
        run: pnpm nx test:mutation ${{ matrix.project }}
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      - name: Upload test mutation report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: report-test-mutation-${{ matrix.project }}
          path: packages/${{ matrix.project }}/reports/mutation
          retention-days: 1
