name: Test Mutation
on:
  push:
    branches:
      - master
      - release
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - elements
          - config
          - policies
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install
      - name: Test Mutation
        run: pnpm nx test:mutation ${{ matrix.project }}
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
      - name: Upload test mutation report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: report-test-mutation-${{ matrix.project }}
          path: packages/${{ matrix.project }}/reports/mutation
          retention-days: 1
