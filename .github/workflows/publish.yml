name: publish-to-npm
on:
  release:
    types: [created]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: contains(github.event.release.tag_name, '-beta.') == false
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/install
    - run: pnpm check:all
    - run: pnpm -r publish --no-git-checks
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    - name: Rename package to eslint-plugin-boundaries
      run: npm pkg set name=eslint-plugin-boundaries
      working-directory: ./packages/eslint-plugin
    - run: pnpm publish --no-git-checks
      working-directory: ./packages/eslint-plugin
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  publish-beta:
    runs-on: ubuntu-latest
    if: contains(github.event.release.tag_name, '-beta.') == true
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/install
    - run: pnpm check:all
    - run: pnpm -r publish --no-git-checks --tag beta
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    - name: Rename package to eslint-plugin-boundaries
      run: npm pkg set name=eslint-plugin-boundaries
      working-directory: ./packages/eslint-plugin
    - run: pnpm publish --no-git-checks --tag beta
      working-directory: ./packages/eslint-plugin
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
