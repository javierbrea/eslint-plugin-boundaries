name: publish-to-npm
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/install
    # NOTE: check:all runs browser-e2e and website-e2e, which need the browsers
    - uses: ./.github/actions/install-browsers
    - run: pnpm check:all
  publish:
    needs: check
    runs-on: ubuntu-latest
    if: contains(github.event.release.tag_name, '-beta.') == false
    environment: npm
    permissions:
      contents: read
      id-token: write  # Required for OIDC
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/install
      with:
        cache: 'false'
    - run: pnpm nx run-many -t build -p elements config policies analysis eslint-plugin --output-style=stream
    - run: pnpm -r publish --no-git-checks
    - name: Rename package to eslint-plugin-boundaries
      run: npm pkg set name=eslint-plugin-boundaries
      working-directory: ./packages/eslint-plugin
    - run: pnpm publish --no-git-checks
      working-directory: ./packages/eslint-plugin
  publish-beta:
    needs: check
    runs-on: ubuntu-latest
    if: contains(github.event.release.tag_name, '-beta.') == true
    environment: npm
    permissions:
      contents: read
      id-token: write  # Required for OIDC
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/install
      with:
        cache: 'false'
    - run: pnpm nx run-many -t build -p elements config policies analysis eslint-plugin --output-style=stream
    - run: pnpm -r publish --no-git-checks --tag beta
    - name: Rename package to eslint-plugin-boundaries
      run: npm pkg set name=eslint-plugin-boundaries
      working-directory: ./packages/eslint-plugin
    - run: pnpm publish --no-git-checks --tag beta
      working-directory: ./packages/eslint-plugin
