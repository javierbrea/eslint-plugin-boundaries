<svg width="820" height="420" viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dependency description links two entities (from and to) plus the dependency metadata">
  <defs>
    <marker id="dd-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7a839d" />
    </marker>
    <filter id="dd-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dependency root -->
  <rect x="290" y="24" width="240" height="64" rx="8" fill="#4e546a" stroke="#2b2e39" stroke-width="2" filter="url(#dd-shadow)"/>
  <text x="410" y="52" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600" font-family="sans-serif">Dependency</text>
  <text x="410" y="74" text-anchor="middle" fill="#cfd6e6" font-size="13" font-family="sans-serif">one import, two sides + metadata</text>

  <!-- Connectors -->
  <path d="M410 88 L410 110 L150 110 L150 132" fill="none" stroke="#7a839d" stroke-width="2" marker-end="url(#dd-arrow)"/>
  <path d="M410 88 L410 132" fill="none" stroke="#7a839d" stroke-width="2" marker-end="url(#dd-arrow)"/>
  <path d="M410 88 L410 110 L670 110 L670 132" fill="none" stroke="#7a839d" stroke-width="2" marker-end="url(#dd-arrow)"/>

  <!-- from -->
  <rect x="34" y="134" width="232" height="232" rx="8" fill="#eef3f4" stroke="#4e546a" stroke-width="2" filter="url(#dd-shadow)"/>
  <text x="150" y="162" text-anchor="middle" fill="#2b2e39" font-size="18" font-weight="600" font-family="monospace">from</text>
  <text x="150" y="182" text-anchor="middle" fill="#4e546a" font-size="12" font-family="sans-serif">the importer</text>
  <line x1="54" y1="196" x2="246" y2="196" stroke="#9aa4bb" stroke-width="1"/>
  <rect x="62" y="214" width="176" height="132" rx="6" fill="#dfedef" stroke="#7a839d" stroke-width="1.5"/>
  <text x="150" y="238" text-anchor="middle" fill="#2b2e39" font-size="14" font-weight="600" font-family="sans-serif">Entity</text>
  <text x="150" y="262" text-anchor="middle" fill="#2b2e39" font-size="13" font-family="monospace">element</text>
  <text x="150" y="286" text-anchor="middle" fill="#2b2e39" font-size="13" font-family="monospace">file</text>
  <text x="150" y="310" text-anchor="middle" fill="#2b2e39" font-size="13" font-family="monospace">module</text>
  <text x="150" y="334" text-anchor="middle" fill="#7a839d" font-size="11" font-family="sans-serif">entity description</text>

  <!-- to -->
  <rect x="294" y="134" width="232" height="232" rx="8" fill="#eef3f4" stroke="#4e546a" stroke-width="2" filter="url(#dd-shadow)"/>
  <text x="410" y="162" text-anchor="middle" fill="#2b2e39" font-size="18" font-weight="600" font-family="monospace">to</text>
  <text x="410" y="182" text-anchor="middle" fill="#4e546a" font-size="12" font-family="sans-serif">the imported target</text>
  <line x1="314" y1="196" x2="506" y2="196" stroke="#9aa4bb" stroke-width="1"/>
  <rect x="322" y="214" width="176" height="132" rx="6" fill="#dfedef" stroke="#7a839d" stroke-width="1.5"/>
  <text x="410" y="238" text-anchor="middle" fill="#2b2e39" font-size="14" font-weight="600" font-family="sans-serif">Entity</text>
  <text x="410" y="262" text-anchor="middle" fill="#2b2e39" font-size="13" font-family="monospace">element</text>
  <text x="410" y="286" text-anchor="middle" fill="#2b2e39" font-size="13" font-family="monospace">file</text>
  <text x="410" y="310" text-anchor="middle" fill="#2b2e39" font-size="13" font-family="monospace">module</text>
  <text x="410" y="334" text-anchor="middle" fill="#7a839d" font-size="11" font-family="sans-serif">entity description</text>

  <!-- dependency metadata -->
  <rect x="554" y="134" width="232" height="232" rx="8" fill="#dfedef" stroke="#4e546a" stroke-width="2" filter="url(#dd-shadow)"/>
  <text x="670" y="162" text-anchor="middle" fill="#2b2e39" font-size="18" font-weight="600" font-family="monospace">dependency</text>
  <text x="670" y="182" text-anchor="middle" fill="#4e546a" font-size="12" font-family="sans-serif">the relationship itself</text>
  <line x1="574" y1="196" x2="766" y2="196" stroke="#9aa4bb" stroke-width="1"/>
  <text x="574" y="220" fill="#2b2e39" font-size="13" font-family="monospace">kind</text>
  <text x="574" y="244" fill="#2b2e39" font-size="13" font-family="monospace">relationship</text>
  <text x="574" y="268" fill="#2b2e39" font-size="13" font-family="monospace">specifiers</text>
  <text x="574" y="292" fill="#2b2e39" font-size="13" font-family="monospace">nodeKind</text>
  <text x="574" y="316" fill="#2b2e39" font-size="13" font-family="monospace">source</text>
  <text x="670" y="350" text-anchor="middle" fill="#7a839d" font-size="11" font-family="sans-serif">dependency metadata</text>
</svg>
